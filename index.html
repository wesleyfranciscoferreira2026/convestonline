<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convest — organize sua rotina, aprenda conteúdos, resolva exercícios e tire dúvidas com a IA." />
    <meta name="theme-color" content="#66CCCC" />
    <title>Convest+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema e a cor de destaque antes da primeira pintura.
      ;(function () {
        try {
          var theme = localStorage.getItem('convest-theme') || localStorage.getItem('aura-theme') || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'

          var accents = {
            turquoise: ['#66cccc', '#54afac'],
            pink: ['#ec4899', '#db2777'],
            yellow: ['#eab308', '#ca8a04'],
            orange: ['#f97316', '#ea580c'],
            purple: ['#8b5cf6', '#7c3aed'],
            blue: ['#3b82f6', '#2563eb'],
            green: ['#22c55e', '#16a34a'],
            red: ['#ef4444', '#dc2626'],
          }
          var accent = localStorage.getItem('convest-accent') || 'turquoise'
          var pair = accents[accent] || accents.turquoise
          document.documentElement.style.setProperty('--color-primary', pair[0])
          document.documentElement.style.setProperty('--color-primary-dark', pair[1])
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
