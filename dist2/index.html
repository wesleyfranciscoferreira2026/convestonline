<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convest — organize sua rotina, aprenda conteúdos, resolva exercícios e tire dúvidas com a IA." />
    <meta name="theme-color" content="#66CCCC" />
    <!-- Evita que o GitHub Pages sirva um HTML antigo apontando para um
         bundle ja removido (a pagina ficaria em branco). -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Convest+</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica o tema e a cor de destaque antes da primeira pintura.
      ;(function () {
        try {
          var theme = localStorage.getItem('convest-theme') || localStorage.getItem('aura-theme') || 'system'
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'

          var accents = {
            turquoise: ['#66cccc', '#54afac'],
            pink: ['#ec4899', '#db2777'],
            yellow: ['#eab308', '#ca8a04'],
            orange: ['#f97316', '#ea580c'],
            purple: ['#8b5cf6', '#7c3aed'],
            blue: ['#3b82f6', '#2563eb'],
            green: ['#22c55e', '#16a34a'],
            red: ['#ef4444', '#dc2626'],
          }
          var accent = localStorage.getItem('convest-accent') || 'turquoise'
          var pair = accents[accent] || accents.turquoise
          document.documentElement.style.setProperty('--color-primary', pair[0])
          document.documentElement.style.setProperty('--color-primary-dark', pair[1])
        } catch (e) {}
      })()
    </script>
    <script type="module" crossorigin src="/convestonline/assets/index-ClnsNQMS.js"></script>
    <link rel="stylesheet" crossorigin href="/convestonline/assets/index-DDkPfZGU.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:24px;font-family:system-ui,sans-serif">
        O Convest+ precisa de JavaScript ativado no navegador.
      </p>
    </noscript>
    <script>
      // Se o bundle nao carregar (cache antigo apontando para arquivo removido),
      // mostra uma mensagem clara em vez de deixar a pagina em branco.
      ;(function () {
        setTimeout(function () {
          if (window.__convestAppLoaded) return
          var root = document.getElementById('root')
          if (!root || root.children.length > 0) return
          root.innerHTML =
            '<div style="max-width:520px;margin:12vh auto;padding:28px;text-align:center;font-family:system-ui,sans-serif;color:#173b3b">' +
            '<h1 style="font-size:20px;margin:0 0 12px">Atualize a pagina</h1>' +
            '<p style="margin:0 0 16px">Uma versao antiga do site ficou em cache. Recarregue para continuar.</p>' +
            '<button onclick="location.reload()" style="padding:10px 18px;border-radius:10px;border:0;background:#66cccc;color:#062b2b;font-weight:600;cursor:pointer">Recarregar agora</button>' +
            '</div>'
        }, 4000)
      })()
    </script>
  </body>
</html>
