name: Deploy — GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Cadastre estes segredos em Settings > Secrets and variables > Actions
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # SPA: o GitHub Pages não tem rewrites — o 404.html faz o React Router
      # assumir rotas profundas como /convestonline/explorar.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Publica a Edge Function de IA (roda em paralelo ao deploy do site).
  # Requer os secrets SUPABASE_ACCESS_TOKEN e GROQ_API_KEY no repositorio.
  # Sem eles, os steps sao ignorados e o app usa o modo "Minha chave".
  deploy-ai:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
        with:
          version: latest

      - name: Publicar secret do provedor de IA
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.GROQ_API_KEY != '' }}
        run: supabase secrets set --project-ref fyujuqqjjadrtmsnqzrb GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" GROQ_BASE_URL="https://api.groq.com/openai/v1" GROQ_MODEL="openai/gpt-oss-120b"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Publicar Edge Function ai-chat
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.GROQ_API_KEY != '' }}
        run: supabase functions deploy ai-chat --no-verify-jwt --project-ref fyujuqqjjadrtmsnqzrb
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: IA do site nao configurada (secrets ausentes)
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' || secrets.GROQ_API_KEY == '' }}
        run: echo "Cadastre SUPABASE_ACCESS_TOKEN e GROQ_API_KEY em Settings > Secrets and variables > Actions para ativar a IA do site."